<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="keel, as an 8-bit game: stage 1, the process dies right after the charge. Continue: charge and reserve replay, ship clears, the card is charged once. Durable execution for TypeScript, zero runtime dependencies." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}.sa{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.se{font-family:Georgia,"Times New Roman",serif}.bl{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dr{}@keyframes dr{to{stroke-dashoffset:0}}
.bk{animation:bk 1.1s steps(1) infinite}@keyframes bk{50%{opacity:0}}.hop{animation:hop .7s steps(2) infinite}@keyframes hop{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style>
<rect width="1200" height="500" fill="#0f380f"/><rect x="18" y="18" width="1164" height="464" fill="#306230"/><rect x="34" y="34" width="1132" height="432" fill="#9bbc0f"/>
<g class="mo" font-weight="700" fill="#0f380f"><text x="70" y="108" font-size="60" letter-spacing="4">KEEL</text>
<text x="72" y="142" font-size="17">DURABLE EXECUTION FOR TYPESCRIPT · NO SERVER · NO DATABASE</text>
<text x="1130" y="80" text-anchor="end" font-size="16">1UP: ZERO RUNTIME DEPS</text>
<text x="72" y="206" font-size="18">STAGE 1 · YOUR PROCESS DIES RIGHT AFTER THE CHARGE</text></g>
<g fill="#0f380f" shape-rendering="crispEdges"><rect x="70" y="392" width="1060" height="14"/>
<rect x="180" y="342" width="44" height="44"/><rect x="360" y="342" width="44" height="44"/><rect x="540" y="342" width="44" height="44" fill="#306230"/>
<g class="hop"><rect x="98" y="336" width="26" height="26"/><rect x="94" y="362" width="34" height="26"/><rect x="104" y="344" width="7" height="7" fill="#9bbc0f"/></g></g>
<g class="mo" font-weight="700" font-size="15" fill="#0f380f"><text x="170" y="328">CHARGE</text><text x="344" y="328">RESERVE</text><text x="540" y="328">SHIP</text><text x="530" y="306" class="bk">✕ K.O.</text></g>
<g class="mo" font-weight="700" font-size="19" fill="#0f380f"><text x="690" y="246" class="in" style="animation-delay:1s">CONTINUE?  ▶ YES</text>
<text x="690" y="286" class="in" style="animation-delay:1.5s">CHARGE ....... REPLAYED</text><text x="690" y="318" class="in" style="animation-delay:1.8s">RESERVE ...... REPLAYED</text><text x="690" y="350" class="in" style="animation-delay:2.1s">SHIP ......... CLEARED</text></g>
<text x="600" y="444" text-anchor="middle" class="mo bk" font-weight="700" font-size="19" fill="#0f380f">CARD CHARGED ×1 · npm i @sudhanshu1402/keel</text></svg>